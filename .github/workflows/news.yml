# Refreshes the pit-wall news wire (public/news.json) every 12 hours and commits it.
# The Pages deploy (deploy.yml) runs after each refresh, so the new headlines go live.
name: News wire
on:
  schedule:
    - cron: '30 0,12 * * *' # 06:00 and 18:00 IST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-news.mjs
      - name: Commit if changed
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add public/news.json
          git diff --cached --quiet || git commit -m "News wire"
          git push
